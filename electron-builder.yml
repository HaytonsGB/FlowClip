appId: com.flowclip.app
productName: FlowClip
copyright: Copyright (c) 2026 HaytonsGB

directories:
  output: release
  buildResources: build

# Stamps the exe icon with rcedit, replacing the built-in step that needs a
# toolchain Windows cannot extract without elevation.
afterPack: scripts/after-pack.cjs

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# ffmpeg lives outside the asar archive: it is spawned as a child process, so it
# has to be a real file on disk. `to: bin` puts it at resources/bin, which is
# exactly what binDir() looks for when app.isPackaged.
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*']
  - from: resources/whisper
    to: whisper
    filter: ['**/*']
  - from: resources/logo.png
    to: logo.png

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Hand-built multi-size ico; see scripts/make-ico.mjs for why not a png.
  icon: build/icon.ico
  artifactName: FlowClip-Setup-${version}.${ext}
  # Built-in exe editing needs the winCodeSign toolchain, whose archive holds
  # macOS symlinks Windows refuses to create without elevation. The afterPack
  # hook does the same job with rcedit instead.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FlowClip
  # 275 MB of ffmpeg dominates the payload; maximum compression is worth the
  # extra build time here.
  differentialPackage: false
